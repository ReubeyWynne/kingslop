name: Site check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js i18n .dsh -type f \( -name '*.js' -o -name '*.cjs' \) -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check site data
        run: |
          node -e "const fs = require('node:fs'); for (const file of fs.readdirSync('_data')) if (file.endsWith('.json')) JSON.parse(fs.readFileSync('_data/' + file, 'utf8'));"
      - name: Check troop allocation
        run: node .dsh/bear-allocator-check.cjs
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
