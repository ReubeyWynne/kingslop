name: Site check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each check runs only when a file it validates changes. A manual run, or a
# change to this workflow, runs everything. The final `check` job is the one
# status to require: it passes when every check that ran passed.

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      logic: ${{ steps.plan.outputs.logic }}
      ascii: ${{ steps.plan.outputs.ascii }}
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            # Chrome every page carries: layout, includes, shared scripts and
            # styles, navigation data and every translation.
            shared: &shared
              - .github/workflows/site-check.yml
              - _config.yml
              - _layouts/**
              - _includes/**
              - _data/nav.json
              - _data/pages.json
              - _data/langs.json
              - css/styles.css
              - css/ascii.css
              - css/ascii-frames.css
              - css/ascii-frames-motion-*.css
              - _data/ascii_motion.json
              - js/common.js
              - js/page-chrome.js
              - js/page-deck.js
              - js/roster-editor.js
              - js/governor-view.js
              - css/equipment.css
              - .dsh/lib/**
              - js/i18n.js
              - js/interactions.js
              - js/player-ledger.js
              - js/player-modules.js
              - js/unit-input.js
              - js/deep-link.js
              - js/server-age.js
              - js/kingdom-progression.js
              - js/kingdom-data.liquid
              - _data/kingdom_progression.json
              - kingdom-timeline/**
              - .dsh/kingdom-progression*.cjs
              - css/kingdom.css
              - i18n/*.js
              - img/kingshot/**
            # Node checks: syntax, data, engines, page wiring.
            logic:
              - *shared
              - '**/*.html'
              - '**/*.css'
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.liquid'
              - '**/*.json'
              - .dsh/**
            ascii:
              - .github/workflows/site-check.yml
              - .dsh/build-ascii.py
              - .dsh/pet-portraits/**
              - .dsh/ascii-style-check.cjs
              - _includes/ascii/**
              - css/**
              - js/*.js
            interactions:
              - *shared
              - .dsh/interaction-modules-check.cjs
              - .dsh/vikings-ui-check.cjs
              - vikings-vengeance/**
              - vv/**
              - js/vikings*.js
              - css/vikings.css
              - _data/vikings.json
              - api/src/**
              - api/migrations/**
              - api/test/database.mjs
            heroes:
              - *shared
              - .dsh/hero-directory-ui-check.cjs
              - heroes/**
              - _includes/heroes/**
              - js/hero-directory*.js
              - js/hero-spend.js
              - js/hero-points.js
              - js/hero-data.liquid
              - js/event-rules.js
              - _data/event_rules.json
              - _data/heroes.json
              - _data/hero_roles.json
              - css/heroes.css
              - img/heroes/**
            masters:
              - *shared
              - .dsh/masters-ui-check.cjs
              - masters/**
              - js/master-*
              - _data/masters.json
              - css/masters.css
              - _includes/masters/**
              - img/masters/**
              - js/hero-spend.js
              - js/event-rules.js
              - _data/event_rules.json
              - town-centre/**
              - js/town-centre*.js
            pets:
              - *shared
              - .dsh/pets-ui-check.cjs
              - pets/**
              - js/pet-*
              - _data/pets.json
              - css/pets.css
              - css/ascii-frames-pets.css
              - css/ascii-frames-pets-motion-*.css
              - css/heroes.css
            castle:
              - *shared
              - .dsh/castle-battle-ui-check.cjs
              - castle-battle/**
              - js/castle-battle*.js
              - css/castle-battle.css
              - _data/castle_battle.json
              - _data/heroes.json
              - _data/hero_roles.json
            events:
              - *shared
              - .dsh/event-availability-check.cjs
              - events/**
              - js/event-*
              - js/kvk.js
              - js/hero-gear-engine.js
              - js/hero-spend.js
              - js/hero-data.liquid
              - _data/heroes.json
              - js/governor-engine.js
              - js/governor-data.liquid
              - _data/governor.json
              - js/master-spend.js
              - js/master-data.liquid
              - _data/masters.json
              - js/town-centre-engine.js
              - js/troop-*
              - js/building-*
              - _data/event_rules.json
              - _data/troops.json
              - _data/buildings.json
              - css/events.css
            governor:
              - *shared
              - .dsh/governor-ui-check.cjs
              - .dsh/governor-fixtures/**
              - governor-gear/**
              - js/governor-*
              - js/screen-import*.js
              - js/import-adapters/governor.js
              - css/screen-import.css
              - _includes/screen-import.html
              - js/event-data.liquid
              - _data/governor.json
              - _data/event_rules.json
              - css/governor*.css
              - css/equipment.css
              - _includes/governor/**
              - img/governor/**
            town:
              - *shared
              - .dsh/town-centre-ui-check.cjs
              - .dsh/number-format-ui-check.cjs
              - town-centre/**
              - js/town-centre*.js
              - js/event-*
              - js/governor-*
              - js/hero-gear-engine.js
              - _data/event_rules.json
              - _data/governor.json
              - css/town.css
              - css/governor-profile.css
              - _includes/governor/**
              - _includes/heroes/**
              - js/hero-directory*.js
              - js/hero-spend.js
              - js/hero-points.js
              - js/building-*
              - img/buildings/**
              - _data/buildings.json
              - js/troop-*
              - _data/troops.json
              - js/hero-data.liquid
              - _data/heroes.json
              - css/heroes.css
              - js/master-*
              - _data/masters.json
              - css/masters.css
              - _includes/masters/**
              - img/masters/**
            priority:
              - *shared
              - .dsh/upgrade-priority-ui-check.cjs
              - .dsh/building-paths-ui-check.cjs
              - buildings/**
              - js/building-paths*
              - _data/building_paths.json
              - css/buildings.css
              - upgrade-priority/**
              - js/upgrade-priority*
              - js/upgrade-goals*
              - js/upgrade-savings*
              - js/event-rules.js
              - _data/event_rules.json
              - _data/upgrade_priority.json
              - css/priority.css
              - js/hero-spend.js
              - js/master-*
              - _data/masters.json
              - js/hero-gear-engine.js
              - js/governor-*
              - _data/governor.json
              - js/building-*
              - _data/buildings.json
              - js/hero-data.liquid
              - _data/heroes.json
              - js/pet-*
              - _data/pets.json
            # Next-step lines from the upgrade priority on six tool pages.
            hints:
              - *shared
              - .dsh/next-step-ui-check.cjs
              - .dsh/home-yours-ui-check.cjs
              - _includes/next-step.html
              - index.html
              - js/home-yours.js
              - css/home.css
              - js/next-step.js
              - css/next-step.css
              - js/upgrade-priority*
              - _data/upgrade_priority.json
              - town-centre/**
              - heroes/**
              - hero-gear/**
              - governor-gear/**
              - pets/**
              - masters/**
              - js/hero-spend.js
              - js/master-*
              - js/hero-gear-engine.js
              - js/governor-*
              - js/building-*
              - js/pet-*
              - _data/buildings.json
              - _data/governor.json
              - _data/heroes.json
              - _data/masters.json
              - _data/pets.json
            # Teaching empty states on the six tool pages.
            empty:
              - *shared
              - .dsh/empty-state-ui-check.cjs
              - _includes/empty-state.html
              - js/empty-state.js
              - css/next-step.css
              - js/screen-import*.js
              - town-centre/**
              - heroes/**
              - hero-gear/**
              - governor-gear/**
              - pets/**
              - masters/**
              - js/hero-gear*.js
              - js/governor-*
              - js/pet-*
              - js/master-*
              - js/hero-directory*.js
              - js/hero-points.js
              - js/town-centre*.js
            seasonal:
              - *shared
              - seasonal/**
              - _includes/seasonal/**
              - _data/seasonal/**
              - js/seasonal*
              - js/halloween*
              - css/seasonal.css
              - .dsh/seasonal*.cjs
            # The deck walks every page and fails on any script error.
            deck:
              - *shared
              - .dsh/page-deck-browser-check.cjs
              - .dsh/site-guide-ui-check.cjs
              - .dsh/simulator-ui-check.cjs
              - '**/index.html'
              - css/**
              - js/**
              - _data/**
            # Scenes sit in page cards, so page markup and styles matter too.
            ascii-capture:
              - *shared
              - .dsh/ascii-capture.cjs
              - .dsh/build-ascii.py
              - '**/index.html'
              - css/**
            hero-gear:
              - *shared
              - .dsh/hero-gear-visual-check.cjs
              - .dsh/hero-gear-interaction-check.cjs
              - .dsh/gear-fixtures/**
              - .dsh/gear-troop-names-check.cjs
              - .dsh/gear-translations-check.cjs
              - i18n/**
              - hero-gear/**
              - js/hero-gear*.js
              - js/ocr-worker.js
              - js/ocr-client.js
              - js/ocr-text.js
              - css/hero-gear.css
              - img/hero-gear/**
              - js/screen-import*.js
              - js/import-*.js
              - js/import-adapters/**
              - css/screen-import.css
              - _includes/screen-import.html
            import:
              - *shared
              - .dsh/screen-import*.cjs
              - .dsh/import-fixtures/**
              - js/ocr-*.js
              - js/screen-import*.js
              - js/import-*.js
              - js/import-adapters/**
              - js/hero-gear-ocr.js
              - js/governor-ocr.js
              - css/screen-import.css
              - img/screen-import/**
              - town-centre/**
      - id: plan
        shell: bash
        env:
          FILTERED: ${{ github.event_name == 'pull_request' }}
          CHANGES: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          all='["interactions","heroes","masters","pets","castle","events","seasonal","governor","town","priority","hints","empty","deck","ascii-capture","hero-gear","import"]'
          if [ "$FILTERED" != true ]; then
            echo "logic=true" >> "$GITHUB_OUTPUT"
            echo "ascii=true" >> "$GITHUB_OUTPUT"
            echo "browser=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has() { jq -e --arg f "$1" 'index($f) != null' <<<"$CHANGES" >/dev/null && echo true || echo false; }
          echo "logic=$(has logic)" >> "$GITHUB_OUTPUT"
          echo "ascii=$(has ascii)" >> "$GITHUB_OUTPUT"
          echo "browser=$(jq -c --argjson all "$all" '[.[] | select(. as $f | $all | index($f))]' <<<"$CHANGES")" >> "$GITHUB_OUTPUT"
          echo "Changed groups: $CHANGES"

  logic:
    needs: changes
    if: needs.changes.outputs.logic == 'true' || needs.changes.outputs.ascii == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        if: needs.changes.outputs.logic == 'true'
        shell: bash
        run: |
          find js i18n .dsh -type f \( -name '*.js' -o -name '*.cjs' \) -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check site data
        if: needs.changes.outputs.logic == 'true'
        run: |
          node -e "const fs = require('node:fs'); for (const file of fs.readdirSync('_data')) if (file.endsWith('.json')) JSON.parse(fs.readFileSync('_data/' + file, 'utf8'));"
      - name: Check page navigation
        if: needs.changes.outputs.logic == 'true'
        run: node --test .dsh/page-deck-check.cjs
      - name: Check ASCII animation style
        if: needs.changes.outputs.ascii == 'true'
        run: |
          python3 .dsh/build-ascii.py --check
          node .dsh/ascii-style-check.cjs
          python3 .dsh/moon-check.py
      - name: Check troop allocation
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/bear-allocator-check.cjs
      - name: Check Vikings allocation
        if: needs.changes.outputs.logic == 'true'
        run: node --test .dsh/vikings-check.cjs
      - name: Check battle engine
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/battle-engine-check.cjs
      - name: Check Castle Battle hero data
        if: needs.changes.outputs.logic == 'true'
        run: node --test .dsh/castle-battle-check.cjs
      - name: Check player ledger and migration
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/player-ledger-check.cjs

      - name: Seasonal event calculations and save compatibility
        if: needs.changes.outputs.logic == 'true'
        run: node --test .dsh/seasonal-check.cjs
      - name: Check kingdom progression and migration
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/kingdom-progression-check.cjs
      - name: Check hero directory data and filters
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/hero-directory-check.cjs
      - name: Check event rules and availability arithmetic
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/event-rules-check.cjs
      - name: Check hero gear costs and search
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/hero-gear-check.cjs
      - name: Check governor gear data, planner and ledger
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/governor-check.cjs
      - name: Check Town Centre points and wiring
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/town-centre-check.cjs
      - name: Check shared spending consistency
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/spending-consistency-check.cjs
      - name: Check upgrade priority
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/upgrade-priority-check.cjs
      - name: Check building requirements data, planner and wiring
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/building-paths-check.cjs
      - name: Check upgrade goals and shortfalls
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/upgrade-goals-check.cjs
      - name: Check savings rates and projections to the next scoring event
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/upgrade-savings-check.cjs
      - name: Check governor equipment presentation
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/governor-view-check.cjs
      - name: Check shared roster editing
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/roster-editor-check.cjs
      - name: Check hero spending plan and Heroes page points
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/hero-spend-check.cjs
      - name: Check masters data, spending plan and wiring
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/master-spend-check.cjs
      - name: Check pet data, Advances, care and wiring
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/pet-care-check.cjs
      - name: Check OCR backend recovery
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/ocr-backend-check.cjs
      - name: Check OCR text helpers
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/ocr-text-check.cjs
      - name: Check screen import adapters
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/screen-import-check.cjs
      - name: Check unit inputs
        if: needs.changes.outputs.logic == 'true'
        run: node .dsh/unit-input-check.cjs

  build:
    needs: changes
    if: needs.changes.outputs.browser != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site
          include-hidden-files: true
          retention-days: 1
          path: _site/

  browser:
    needs: [changes, build]
    if: needs.changes.outputs.browser != '[]'
    name: browser (${{ matrix.group }})
    runs-on: ubuntu-latest
    # The checks take a few minutes; the rest is headroom for the system
    # libraries below when the package mirror is slow and the cache is cold.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.browser) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site
          path: _site
      - id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: playwright-1.63.0-chromium-${{ runner.os }}
          path: |
            ${{ runner.temp }}/visuals
            ~/.cache/ms-playwright
      - name: Install preview browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/visuals" --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/visuals/node_modules/playwright/cli.js" install chromium
      # Every group installs the same ~25 MB of fonts and libraries, all at
      # once, and the runners' Ubuntu mirror has crawled under that load (one
      # 3.7 MB package took 90 s), so the downloaded packages are kept in a
      # cache that apt reads before it goes to the mirror.
      - name: Keep downloaded system packages
        run: |
          mkdir -p ~/apt-cache/partial
          printf '%s\n' 'Dir::Cache::Archives "/home/runner/apt-cache";' 'APT::Keep-Downloaded-Packages "true";' 'APT::Sandbox::User "root";' 'Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-cache > /dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: apt-playwright-1.63.0-chromium-${{ runner.os }}
          # Only the packages: apt keeps its partial/ directory to root.
          path: ~/apt-cache/*.deb
      - name: Install browser system libraries
        timeout-minutes: 15
        run: |
          node "$RUNNER_TEMP/visuals/node_modules/playwright/cli.js" install-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/visuals/node_modules" >> "$GITHUB_ENV"
      - name: Check shared interaction modules
        if: matrix.group == 'interactions'
        run: |
          node --test .dsh/lib/browser-harness.test.cjs
          node .dsh/interaction-modules-check.cjs
      - name: Check seasonal event UI
        if: matrix.group == 'seasonal'
        run: node .dsh/seasonal-ui-check.cjs
      - name: Check kingdom timeline UI
        if: matrix.group == 'heroes'
        run: node .dsh/kingdom-progression-ui-check.cjs
      - name: Check hero directory UI
        if: matrix.group == 'heroes'
        run: node .dsh/hero-directory-ui-check.cjs
      - name: Check masters UI
        if: matrix.group == 'masters'
        run: node .dsh/masters-ui-check.cjs
      - name: Check pets UI
        if: matrix.group == 'pets'
        run: node .dsh/pets-ui-check.cjs
      - name: Check Castle Battle UI
        if: matrix.group == 'castle'
        run: node .dsh/castle-battle-ui-check.cjs
      - name: Check event availability UI
        if: matrix.group == 'events'
        run: node .dsh/event-availability-check.cjs
      - name: Check governor gear UI
        if: matrix.group == 'governor'
        run: node .dsh/governor-ui-check.cjs
      - name: Check Town Centre UI
        if: matrix.group == 'town'
        run: node .dsh/town-centre-ui-check.cjs
      - name: Check number format
        if: matrix.group == 'town'
        run: node .dsh/number-format-ui-check.cjs
      - name: Check upgrade priority UI
        if: matrix.group == 'priority'
        run: node .dsh/upgrade-priority-ui-check.cjs
      # The planner check drives the real Worker against node:sqlite, which needs Node 22.13 or later.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.group == 'interactions'
        with:
          node-version: 24
      - name: Check Vikings planner UI
        if: matrix.group == 'interactions'
        run: node .dsh/vikings-ui-check.cjs
      - name: Check building requirements UI
        if: matrix.group == 'priority'
        run: node .dsh/building-paths-ui-check.cjs
      - name: Check next-step lines on the tool pages
        if: matrix.group == 'hints'
        run: node .dsh/next-step-ui-check.cjs
      - name: Check your kingdom on the home page
        if: matrix.group == 'hints'
        run: node .dsh/home-yours-ui-check.cjs
      - name: Check teaching empty states on the tool pages
        if: matrix.group == 'empty'
        run: node .dsh/empty-state-ui-check.cjs
      - name: Check page navigation in browser
        if: matrix.group == 'deck'
        run: node .dsh/page-deck-browser-check.cjs
      - name: Check the deck guide in browser
        if: matrix.group == 'deck'
        run: node .dsh/site-guide-ui-check.cjs
      - name: Check simulator battle reports and activity
        if: matrix.group == 'deck'
        run: node .dsh/simulator-ui-check.cjs
      - name: Check ASCII scenes frame by frame
        if: matrix.group == 'ascii-capture'
        run: |
          node .dsh/ascii-capture.cjs --frames
          python3 -m pip install Pillow==11.3.0
          python3 .dsh/moon-review-gif.py
      - name: Check hero gear UI
        if: matrix.group == 'hero-gear'
        run: node .dsh/hero-gear-visual-check.cjs
      - name: Check hero gear automatic recommendations
        if: matrix.group == 'hero-gear'
        run: node .dsh/hero-gear-interaction-check.cjs
      - name: Check hero gear troop and slot names in every language
        if: matrix.group == 'hero-gear'
        run: node .dsh/gear-troop-names-check.cjs
      - name: Check hero gear strings in every language at 320px
        if: matrix.group == 'hero-gear'
        run: node .dsh/gear-translations-check.cjs
      - name: Check screenshot import dock
        if: matrix.group == 'import'
        run: node .dsh/screen-import-ui-check.cjs
      - name: Check the screenshot recipe in the import dock
        if: matrix.group == 'import'
        run: node .dsh/screen-import-recipe-check.cjs
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .dsh/gear-preview/
            .dsh/event-preview/
            .dsh/hero-directory-preview/
