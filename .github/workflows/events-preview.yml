name: Events preview

on:
  pull_request:
    paths:
      - 'events/**'
      - 'css/**'
      - 'js/**'
      - 'i18n/**'
      - 'img/**'
      - '_includes/**'
      - '_layouts/**'
      - '_data/**'
      - '_config.yml'
      - '.dsh/events-visual-check.cjs'
      - '.github/workflows/events-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
      - name: Install preview browser
        run: |
          npm install --prefix "$RUNNER_TEMP/events-visuals" --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/events-visuals/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check events and capture previews
        env:
          NODE_PATH: ${{ runner.temp }}/events-visuals/node_modules
        run: node .dsh/events-visual-check.cjs
      - name: Upload built site and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: events-preview
          include-hidden-files: true
          retention-days: 14
          path: |
            _site/
            .dsh/events-preview/
