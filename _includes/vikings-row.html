{% comment %} A player on the leader's list (`p` in scope): who, when they last saved, what they send and what
   they are missing. A leader removes a player from the cross beside the row; the example has no cross. {% endcomment %}{% capture row %}<button type="button" class="vv-row" @click="assign(p.id)"><img src="../img/buildings/town-center.webp" alt="" width="40" height="40" loading="lazy"><span class="vv-row-main"><span class="vv-row-top"><strong x-text="p.nickname"></strong><span class="vv-avail" :data-presence="p.availability || 'unknown'" x-text="presence(p)"></span><template x-if="p.updatedAt"><span class="vv-avail" :title="stamp(p)" x-text="ago(p.updatedAt)"></span></template></span><span class="vv-dim" x-text="rowLine(p)"></span><template x-if="gaps(p)"><span class="vv-gap" x-text="gaps(p)"></span></template></span><span class="vv-chevron">›</span></button>{% endcapture %}<div class="vv-row-slot"><template x-if="!state.example"><div class="vv-row-line">{{ row }}<button type="button" class="vv-row-x" :aria-label="'Remove ' + p.nickname" title="Remove" @click="removePlayer(p.id)">×</button></div></template><template x-if="state.example">{{ row }}</template></div>
