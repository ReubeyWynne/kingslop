<article class="candy-offer"><template x-if="pass.owned"><div class="candy-slot"><h3 x-html="pass.heading"></h3><p class="candy-context" x-text="pass.claimed"></p><button type="button" class="seasonal-link" @click="openProgress('passes'); $refs.progress.showModal()">Edit pass progress</button></div></template><template x-if="!pass.owned"><div class="candy-slot"><div class="candy-offer-heading"><h3 x-html="pass.heading"></h3><span class="candy-price" x-text="pass.price"></span></div><div class="candy-offer-stats"><template x-for="stat in pass.stats"><div><strong x-text="stat[0]"></strong><span x-text="stat[1]"></span></div></template></div><p class="candy-context" x-text="pass.candy"></p><details :id="pass.id"><summary>Expected pass items and extra chest rewards</summary><div class="candy-slot" x-html="pass.rewards"></div></details><button type="button" class="seasonal-link add-pass" :data-index="pass.i" x-text="pass.add" @click="addPass(pass.i)"></button><button type="button" class="seasonal-link mark-owned" :data-index="pass.i" @click="toggleOwned(pass.i)">I already own this</button></div></template></article>
