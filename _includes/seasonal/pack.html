<article class="candy-offer" :id="pack.id"><div class="candy-offer-heading"><h3 x-html="pack.heading"></h3><span class="candy-price" x-text="pack.price"></span></div><div class="candy-offer-stats"><template x-for="stat in pack.stats"><div><strong x-text="stat[0]"></strong><span x-text="stat[1]"></span></div></template></div><p class="candy-value-split" x-text="pack.split"></p><template x-if="pack.unlock"><p class="candy-context" x-text="pack.unlock"></p></template><h4>Fixed rewards · guaranteed</h4><div class="candy-slot" x-html="pack.fixed"></div><p class="candy-currency-bonus" x-html="pack.bonus"></p><template x-if="pack.unpriced"><p class="candy-context" x-text="pack.unpriced"></p></template><details :id="pack.value"><summary>Combined items: fixed rewards + candy EV</summary><div class="candy-slot" x-html="pack.rewards"></div></details><button type="button" class="seasonal-link add-pack" :data-index="pack.i" :disabled="!pack.available" x-text="pack.add" @click="addPack(pack.i)"></button><template x-if="pack.count"><button type="button" class="seasonal-link remove-pack" :data-index="pack.i" @click="removePack(pack.i)">Remove</button></template></article>
