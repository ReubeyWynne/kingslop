{% comment %} One date on the Coming up list (`d` in scope), under its week's heading: the day, what, who has it. Tap it to hand it on or mark it done; anyone leading takes an open one with the button. {% endcomment %}<div class="hub-task hub-duty" :data-nobody="String(d.unowned)" :data-mine="String(d.mine)" :data-done="String(d.done)">
          <button type="button" class="hub-duty-main" :aria-label="'Open ' + d.task + ' on ' + d.when" @click="editDuty(d)"><span class="hub-day" x-text="d.day"></span><span class="hub-task-main"><span class="vv-row-top"><strong x-text="d.task"></strong><template x-if="d.done"><output class="seal" data-state="saved">Done</output></template></span><span class="hub-holders" x-text="[d.until, d.line].filter(Boolean).join(' · ')"></span></span></button>
          <template x-if="!d.mine && d.unowned && !d.done"><button type="button" class="vv-secondary" :disabled="busy" :aria-label="'Take ' + d.task + ' on ' + d.when" @click="takeDuty(d)">Take</button></template>
        </div>
