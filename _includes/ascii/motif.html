<div class="ascii-motif-rail" aria-hidden="true">
  {% if include.kind == 'castle' %}
  {% include ascii/castle.html %}
  {% elsif include.kind == 'aurora' %}
  {% include ascii/aurora.html %}
  {% elsif include.kind == 'charm' %}
  <span class="ascii-mini ascii-mini--charm"><span class="charm-sea"></span><span class="charm-pennant"></span></span>
  {% elsif include.kind == 'moon' %}
  {% include ascii/moon.html %}
  {% else %}
  <span class="ascii-mini ascii-mini--{{ include.kind }}"></span>
  {% endif %}
</div>
