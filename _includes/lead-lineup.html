{% comment %} A lineup as three roster tiles, infantry → cavalry → archers, from the lead finder's
   `seats` (js/pages/lead-finder.mjs): the troop mark top left, the widget top right, five stars
   with the tier as six notches along the foot. An empty seat stays dashed. {% endcomment %}<span class="lead-heroes{% if include.big %} lead-heroes-big{% endif %}"><template x-for="seat in {{ include.seats }}"><span :class="seat.copy ? 'lead-hero' : 'lead-hero lead-hero-empty'" :data-troop="seat.type"><span class="directory-portrait lead-portrait"><template x-if="seat.copy"><img :src="seat.img" alt="" width="70" height="70" loading="lazy" decoding="async"></template><template x-if="!seat.copy"><span class="lead-seat"></span></template><svg class="hero-troop-mark" aria-hidden="true" focusable="false"><use :href="'#troop-' + seat.type"></use></svg><template x-if="seat.widget"><span class="hero-portrait-widget" aria-hidden="true"><svg aria-hidden="true" focusable="false"><use href="#hero-widget-mark"></use></svg><b x-text="seat.widget"></b></span></template><template x-if="seat.copy"><span class="hero-portrait-stars" aria-hidden="true"><span class="hero-star-row"><template x-for="on in seat.stars"><i :data-on="on ? '' : null">★</i></template></span><span class="hero-star-tier"><template x-for="on in seat.notches"><i :data-on="on ? '' : null"></i></template></span></span></template></span><span class="lead-hero-name"><b x-text="seat.name"></b><small x-text="seat.small"></small></span></span></template></span>
