{% comment %} One march as the planner lists it, from a `march` in js/pages/vikings.mjs (in scope as `m`): its queue,
   where it goes, and its troops unless the plan is even marches with everything in them. {% endcomment %}<div class="vv-march"><span class="vv-queue" x-text="m.queue"></span><template x-if="m.hq"><span class="vv-hq-mark" aria-hidden="true">HQ</span></template><template x-if="!m.hq"><img src="../img/buildings/town-center.webp" alt="" width="48" height="48" loading="lazy"></template><div class="vv-march-main"><div class="vv-march-head"><strong x-text="m.label"></strong><template x-if="!m.plain"><span class="vv-total" x-text="m.total"></span></template></div><template x-if="!m.plain">{% include vikings-counts.html of="m.row" %}</template><template x-if="m.note"><p class="vv-caption" x-text="m.note"></p></template></div></div>
