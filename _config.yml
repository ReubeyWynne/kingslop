# Kingshot, Demystified — dey.ci
# GitHub Pages builds this with Jekyll. Shared page chrome lives in layouts and
# includes; runtime translations and page tools remain plain client-side assets.
url: "https://dey.ci"

# Documentation and local validation material must not be published with the site.
exclude:
  - ".dsh"
  - ".impeccable"
  - ".gitignore"
  - "DESIGN.md"
  - "MATHS.md"
  - "NAV-PROPOSAL.md"
  - "PRODUCT.md"
  - "*.md"
  - "**/*.md"
